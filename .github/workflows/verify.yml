name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
      - run: docker compose up --detach --build app collab scheduler
      - run: |
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health && exit 0
          docker compose logs --tail=100 app postgres minio
          exit 1
      - run: pnpm test:integration:prepare
      - run: pnpm test:integration
      - if: always()
        run: docker compose logs --tail=100 app postgres minio
